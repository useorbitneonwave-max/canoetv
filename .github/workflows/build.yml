name: Build CanoeTV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CanoeTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CanoeTV-apk
          path: CanoeTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: CanoeTV 1.3.${{ github.run_number }}
          body: |
            Download **CanoeTV.apk** below and install it on your Android phone, tablet, Android TV or Fire TV.
            Fire TV / Android TV: enter code **8491975** in the Downloader app.
            Permanent link to the newest version: https://github.com/${{ github.repository }}/releases/latest/download/CanoeTV.apk
          files: CanoeTV.apk
          make_latest: true
